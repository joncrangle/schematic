<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="schematic-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111422"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>

    <!-- Faint CAD Square Grid -->
    <pattern id="schematic-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <!-- Full Bleed Base & Grid -->
  <rect width="512" height="512" fill="url(#schematic-bg)"/>
  <rect width="512" height="512" fill="url(#schematic-grid)"/>

  <!-- Subtle Center Crosshairs -->
  <line x1="256" y1="48" x2="256" y2="464" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="48" y1="256" x2="464" y2="256" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Transverse Route: Amber Spine -->
  <path d="M 64 256 L 448 256" 
        fill="none" stroke="#F59E0B" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Corridor 1: Outer Cyan Track -->
  <path d="M 120 440 L 120 320 L 256 184 L 384 184 L 440 128" 
        fill="none" stroke="#06B6D4" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Corridor 2: Inner Emerald Track -->
  <path d="M 176 440 L 176 344 L 276 244 L 384 244 L 440 188" 
        fill="none" stroke="#10B981" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Interchange Node 1: West Cross (Cyan x Amber) -->
  <circle cx="120" cy="256" r="24" fill="#080a10" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="120" cy="256" r="9" fill="#06B6D4"/>

  <!-- Interchange Node 2: Central Cross (Emerald x Amber) -->
  <circle cx="176" cy="256" r="24" fill="#080a10" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="176" cy="256" r="9" fill="#10B981"/>

  <!-- Interchange Node 3: Grand Dual-Track Terminal Capsule (East) -->
  <rect x="364" y="164" width="40" height="100" rx="20" fill="#080a10" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="384" cy="184" r="8" fill="#06B6D4"/>
  <circle cx="384" cy="244" r="8" fill="#10B981"/>

  <!-- Subtle Inset Technical Frame -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>
</svg>

