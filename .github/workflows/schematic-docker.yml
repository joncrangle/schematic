name: Schematic Container

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Schematic CI
    uses: ./.github/workflows/ci.yml
    with:
      upload-build: true
    permissions:
      contents: read
      pull-requests: read

  docker:
    name: Build & Push Schematic Container
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: schematic-build
          path: ci-assets

      - name: Extract production assets
        run: tar -xzf ci-assets/schematic-build.tar.gz -C ci-assets

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/schematic
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build and push container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: ASSETS=ci
          build-contexts: ci-assets=./ci-assets
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
